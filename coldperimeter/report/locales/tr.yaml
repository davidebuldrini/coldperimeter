checklist:
  cellular_router: "Kontrolöre ya da soğutma dolabına bağlı bir hücresel (4G/LTE) router veya modem var mı?"
  remote_desktop: "Kontrolöre ulaşabilen bir market bilgisayarında uzak masaüstü yazılımı (TeamViewer, AnyDesk, VNC veya benzeri) kurulu mu?"
  dialup_modem: "Kontrolöre bağlı bir telefon hattı modemi var mı?"
  second_wan: "Marketin, bu dizüstü bilgisayarın kullandığı hattan başka ikinci bir internet hattı var mı?"
  vendor_cloud: "Kontrolörde üretici veya servis firmasının bulut tabanlı uzaktan erişim hizmeti açık mı?"
  passwords_changed: "Kontrolörün fabrika çıkışı varsayılan şifreleri değiştirildi mi?"
  alarm_path_known: "Sıcaklık alarmlarının bakım merkezine nasıl ulaştığı (e-posta, SMS, bulut, doğrudan bağlantı) belgelenmiş mi?"

steps:
  1:
    title: "Mevcut durumu kaydedin"
    intro: "Herhangi bir şeyi değiştirmeden önce, kontrolöre bugün nasıl ulaşıldığını ve alarmların marketten nasıl çıktığını yazın."
    always:
      - "Bu raporu ve kaydedilen tarama dosyasını “önceki durum” kaydı olarak saklayın."
      - "Kontrolöre uzaktan bağlanan herkesi ve nasıl bağlandıklarını listeleyin."
  2:
    title: "Bakım merkezine VPN kurun"
    intro: "Eski yol çalışırken önce yeni, güvenli yolu kurun."
    always:
      - "Market ile bakım merkezi arasında, market güvenlik duvarında veya ayrı bir VPN router'ında sonlanan bir siteden siteye ya da istemci VPN'i kurun."
      - "VPN üzerinden yalnızca kontrolörün adresine ve bakım merkezinin ihtiyaç duyduğu portlara izin verin."
      - "VPN'de ortak hesap kullanmayın; her teknisyene ayrı hesap açın."
  3:
    title: "Uzaktan yönetimi ve alarmları VPN üzerinden doğrulayın"
    intro: "Bu adım başarılı olmadan hiçbir şeyi kapatmayın. Kaçan bir sıcaklık alarmının maliyeti, ortadan kaldırılan riskten daha büyüktür."
    always:
      - "Bakım merkezinden VPN üzerinden kontrolöre bağlanın ve canlı değerleri okuyun."
      - "Bir deneme alarmı oluşturun ve alarmın yeni yoldan bakım merkezine ulaştığını doğrulayın."
      - "Kontrolörün kendi gönderdiği alarm e-postalarının veya SMS'lerinin marketten hâlâ çıkabildiğini doğrulayın."
  4:
    title: "İnternetten doğrudan erişimi kaldırın"
    intro: "VPN'in çalıştığı kanıtlandıktan sonra diğer tüm giriş yollarını kapatın."
    always:
      - "Router'daki, kontrolörü gösteren port yönlendirme kurallarını silin."
      - "Router'da UPnP'yi kapatın."
  5:
    title: "Ağı bölümlere ayırın"
    intro: "Soğutma ekipmanını ayrı bir ağa koyun; böylece ele geçirilmiş bir market bilgisayarı veya misafir Wi-Fi cihazı ona ulaşamaz."
    always:
      - "Kontrolörleri ayrı bir VLAN'a veya fiziksel olarak ayrı bir ağa taşıyın."
      - "Bu ağa yalnızca VPN'den ve adı belli yönetim bilgisayarlarından erişime izin verin."
  6:
    title: "Doğrulamak için tekrar tarayın"
    intro: "Denetimi market ağından yeniden yapın ve sonucu bu raporla karşılaştırın."
    always:
      - "ColdPerimeter'ı dış prob açıkken yeniden çalıştırın; hiçbir kontrolör portu internetten yanıt vermemelidir."
      - "Birkaç hafta sonra genel dizini yeniden kontrol edin; eski kayıtların silinmesi zaman alır."
  7:
    title: "Kontrolörleri sağlamlaştırın"
    intro: "Yalıtım zaman kazandırır; bu işlemler ise zayıflıkların kendisini ortadan kaldırır."
    always:
      - "Varsayılan ve ortak şifreleri kişiye özel şifrelerle değiştirin."
      - "Üreticinin artık desteklemediği modellerin değiştirilmesini planlayın."

findings:
  EXT-OPEN-CONTROLLER:
    title: "Kontrolöre internetten {port} portuyla ulaşılabiliyor"
    detail: "{public_ip} genel adresindeki {port} portu internetten yanıt veriyor ve bir soğutma kontrolörüne çıkıyor. Giriş sayfasına herkes ulaşabilir."
    action: "Router/güvenlik duvarında kontrolöre giden {port} portunu kapatın (3. adım başarıyla geçildikten sonra)."
  EXT-OPEN-OTHER:
    title: "Genel adreste {port} portu açık"
    detail: "{public_ip} adresindeki {port} portu internetten yanıt veriyor. Denetim bunu bir kontrolörle ilişkilendiremedi; hangi cihaza çıktığını bulun."
    action: "Genel {port} portunun arkasında ne olduğunu belirleyin; gerekli ve belgelenmiş değilse kapatın."
  UPNP-MAP-CONTROLLER:
    title: "Router, {protocol} {external_port} portunu kontrolöre yönlendiriyor"
    detail: "Router'da {external_port} dış portundan kontrolörün {internal_port} portuna giden bir port eşlemesi var. Router'ın genel adresi varsa bu, kontrolörü internete açar."
    action: "{protocol} {external_port} -> kontrolör portu {internal_port} router eşlemesini silin."
  UPNP-ENABLED:
    title: "Router'da UPnP açık"
    detail: "Market ağındaki herhangi bir cihaz veya program, kimse fark etmeden router'dan internete port açmasını isteyebilir. Router şu anda {count} eşleme listeliyor."
    action: "Router'da UPnP / NAT-PMP'yi kapatın ve kalan eşlemeleri gözden geçirin."
  INDEXED:
    title: "Marketin genel adresi herkese açık bir dizinde listeleniyor"
    detail: "Herkese açık bir internet dizini {public_ip} adresini şu açık portlarla listeliyor: {ports}. Saldırganlar kontrolör bulmak için bu dizinleri tarar."
    action: "Portları kapattıktan birkaç hafta sonra dizini yeniden kontrol edin ve kayıtların silindiğini doğrulayın."
  EXT-NOT-TESTED:
    title: "İnternetten dışa açıklık denenmedi"
    detail: "Dış prob çalıştırılmadı; bu yüzden bu rapor kontrolörün internetten yanıt verip vermediğini doğrulayamaz. Router kuralları ve genel dizin yalnızca dolaylı kanıttır."
    action: "Taramayı dış prob açıkken tekrarlayın (--probe-url)."
  CGNAT:
    title: "Router başka bir NAT'ın arkasında"
    detail: "Router'ın WAN adresi ({wan_ip}) genel adresten ({public_ip}) farklı. Bu router'daki port yönlendirmelerine büyük olasılıkla internetten ulaşılamaz; ancak bir üst router veya servis sağlayıcının hizmeti yine de trafiği yönlendiriyor olabilir."
    action: "Bir üst router'ın veya servis sağlayıcının bu router'a port yönlendirip yönlendirmediğini kontrol edin."
  FLAT-NET:
    title: "Kontrolöre genel market ağından ulaşılabiliyor"
    detail: "Kontrolör, tarama yapan dizüstü bilgisayarın bağlı olduğu ağdan yanıt verdi. Bu ağdaki her cihaz ona ulaşabilir."
    action: "Bu kontrolörü ayrı soğutma ağına taşıyın."
  XML-NOAUTH:
    title: "Kontrolör veri isteklerine şifresiz yanıt veriyor"
    detail: "Kontrolörün XML arayüzü, kimlik bilgisi istemeden kimliğini bildirdi. Aynı arayüz değerleri okuyabilir ve ayara bağlı olarak ayarları değiştirebilir."
    action: "Kontrolörde XML arayüzü için kimlik doğrulamayı açın (üreticinin güvenlik önerilerine bakın) ve yazılımı güncelleyin."
  XML-PUBLIC-ADDR:
    title: "Kontrolörde internet adresi tanımlı"
    detail: "Kontrolör kendisi {address} internet adresini bildiriyor; bu, doğrudan internetten erişilecek şekilde kurulduğunu gösterir."
    action: "Uzaktan erişim VPN üzerinden sağlanmaya başlayınca internet adresini kontrolörün ayarlarından kaldırın."
  HTTP-PLAIN:
    title: "Web arayüzü şifrelenmemiş"
    detail: "Kontrolörün web arayüzü düz HTTP ile sunuluyor (port {ports}). Şifreler ağda korumasız dolaşır."
    action: "Model destekliyorsa HTTPS kullanın; desteklemiyorsa erişimi soğutma ağı ve VPN ile sınırlayın."
  LEGACY-SVC:
    title: "Eski tip uzaktan erişim servisleri açık"
    detail: "Kontrolör zayıf korumalı veya korumasız servisler sunuyor: {services}."
    action: "Kontrolörde kullanılmayan servisleri ({services}) kapatın veya soğutma ağının sınırında engelleyin."
  MODBUS-OPEN:
    title: "Modbus TCP açık"
    detail: "Kontrolör, kimlik doğrulaması olmayan bir protokol olan Modbus TCP'yi kabul ediyor. 502 portuna ulaşabilen her cihaz değerleri okuyabilir ve yazabilir."
    action: "Modbus TCP'yi soğutma ağının sınırında engelleyin; yalnızca ihtiyacı olan sistemlere izin verin."
  ADVISORY:
    title: "Yayımlanmış güvenlik bildirimleri geçerli olabilir"
    detail: "Tespit edilen model: {model}, yazılım sürümü: {firmware}. Kontrol edilecek üretici bildirimleri: {advisories}. Araç yazılım sürümlerini otomatik olarak karşılaştırmaz."
    action: "Kurulu yazılım sürümünü bildirimlerle ({advisories}) karşılaştırın; eskiyse güncelleyin."
  LOW-CONFIDENCE:
    title: "Olası kontrolör, doğrulanmadı"
    detail: "Bu cihaz yalnızca zayıf belirtilerle eşleşti. Bir kontrolör olabilir ya da aynı üreticinin başka bir cihazı olabilir."
    action: "Bu cihazın ne olduğunu yerinde doğrulayın."
  UNIDENTIFIED:
    title: "Endüstriyel portları açık, tanınmayan cihaz"
    detail: "Bu cihazda endüstriyel portlar açık ({ports}) ama cihaz tanınamadı."
    action: "Cihazı yerinde belirleyin ve ileride tanınabilmesi için üzerinde `coldperimeter capture` komutunu çalıştırın."
  NO-CONTROLLER:
    title: "Hiçbir kontrolör tespit edilemedi"
    detail: "Tarama hiçbir soğutma kontrolörü tanımadı. Kontrolör başka bir ağ bölümünde olabilir, kapalı olabilir veya aracın henüz tanımadığı bir model olabilir."
    action: "Kontrolörün nereye bağlı olduğunu sorun ve o ağ bölümünü tarayın ya da adresini --targets ile verin."
  CHK-CELLULAR:
    title: "Soğutma sistemine hücresel router bağlı"
    detail: "Hücresel router, internetten kontrolöre giden ikinci ve ayrı bir yol açar; market güvenlik duvarı bu yolu görmez."
    action: "Hücresel router'ın kime ait olduğunu ve genel adresi olup olmadığını öğrenin; yerine VPN kurun veya yalnızca VPN'e izin verecek şekilde kilitleyin."
  CHK-REMOTE-DESKTOP:
    title: "Uzak masaüstü yazılımı kontrolöre ulaşabiliyor"
    detail: "Market bilgisayarındaki uzak masaüstü yazılımı, kimlik bilgilerine sahip olan herkesin kontrolöre her yerden ulaşmasını sağlar."
    action: "Uzak masaüstü yazılımını kaldırın veya kısıtlayın; bakım erişimini VPN üzerinden verin."
  CHK-DIALUP:
    title: "Kontrolöre telefon hattı modemi bağlı"
    detail: "Telefon modemi, ağı tamamen atlayan doğrudan bir giriş yoludur."
    action: "Alarm yolu buna bağlı değilse modemi çıkarın; bağlıysa önce o yolu değiştirin (2-3. adımlar)."
  CHK-SECOND-WAN:
    title: "Marketin ikinci bir internet hattı var"
    detail: "Bu tarama yalnızca dizüstü bilgisayarın kullandığı hatta baktı. Diğer hat kendi port yönlendirmelerini yapıyor olabilir."
    action: "Taramayı ikinci hatta bağlıyken tekrarlayın."
  CHK-VENDOR-CLOUD:
    title: "Üretici bulut hizmeti kullanılıyor"
    detail: "Kontrolör, üreticinin veya servis firmasının bulutuyla haberleşiyor. Yalıtımdan sonra bu yol çalışmaya devam etmeli ya da bilinçli olarak başka bir yolla değiştirilmeli."
    action: "Bulut hizmetini belgeleyin ve güvenlik duvarında yalnızca onun giden trafiğine izin verin."
  CHK-PASSWORDS:
    title: "Varsayılan şifrelerin değiştirildiği doğrulanmadı"
    detail: "Fabrika çıkışı şifreler herkesçe bilinir. Hâlâ geçerliyse giriş sayfasına ulaşan herkes içeri girebilir."
    action: "Kontrolördeki tüm varsayılan şifreleri değiştirin."
  CHK-ALARM-PATH:
    title: "Alarm yolu belgelenmemiş"
    detail: "Yerinde kimse sıcaklık alarmlarının bakım merkezine nasıl ulaştığını söyleyemedi. Bunu bilmeden erişimi kapatmak, alarmların susmasına yol açabilir."
    action: "4. adıma başlamadan önce alarm yolunu belgeleyin."
  CHK-UNKNOWN:
    title: "Cevaplanmamış kontrol listesi soruları var"
    detail: "Bu erişim yolları ağ taramasıyla görülemez ve yerinde kontrol edilmedi: {questions}"
    action: "Açık kalan kontrol listesi sorularını yerinde cevaplayın."

limits:
  - "Taranan ağdan farklı ağ bölümlerindeki veya VLAN'lardaki cihazlar."
  - "Hücresel router ve modem gibi ağ dışındaki erişim yolları (yalnızca kontrol listesiyle ele alınır)."
  - "UPnP kapalıyken router'daki port yönlendirmeleri; bunları router'ın yönetim sayfasından okuyun."
  - "BACnet/IP gibi UDP servisleri."
  - "Danfoss kontrolörlerinin tanınması üretici belgelerine dayanır ve gerçek cihazlarda henüz doğrulanmamıştır."
  - "Bu denetim yalnızca okur; hiçbir şifre denemedi ve hiçbir şeyi değiştirmedi."

vpn:
  hub_name: "aktarma sunucusu"
  center_name: "bakım merkezi"
  instructions_title: "VPN kurulum adımları"
  intro: "Bu dosyalar, marketin sunucuya doğru açtığı bir WireGuard tüneli kurar. Markette hiçbir port açılmaz. Dosyaları ColdPerimeter oluşturdu; hiçbir cihazda değişiklik yapılmadı."
  server_new: "{server} makinesinde (genel adres {endpoint}): WireGuard'ı kurun, `{file}` dosyasını `/etc/wireguard/wg0.conf` olarak kopyalayın, güvenlik duvarında {port} UDP portuna izin verin, sonra tüneli `wg-quick up wg0` ile başlatın."
  server_existing: "Mevcut {server} üzerinde: `{file}` dosyasının içeriğini WireGuard yapılandırmasının sonuna ekleyin ve yapılandırmayı yeniden yükleyin."
  store_gateway: "Market geçidinde (kontrolörle aynı ağa takılı küçük bir Linux cihazı): WireGuard ve iptables'ı kurun, `{file}` dosyasını `/etc/wireguard/wg0.conf` olarak kopyalayın, `wg-quick up wg0` ile başlatın ve açılışta çalışması için `systemctl enable wg-quick@wg0` komutunu verin."
  store_router: "Market router'ında: `{file}` dosyasını WireGuard bölümüne aktarın, ardından tünelin yalnızca {targets} adresine ulaşmasına izin veren bir güvenlik duvarı kuralı ekleyin."
  technician: "Teknisyenin dizüstü bilgisayarında: `{file}` dosyasını WireGuard uygulamasına aktarın ve etkinleştirin."
  verify: "Tünel çalışırken, doğrudan erişimi kaldırmadan önce ColdPerimeter'daki doğrulamayı çalıştırın (plan 3. adım)."
  access_title: "Kontrolöre VPN üzerinden nasıl ulaşılır"
  access_line: "Kontrolör {controller} port {controller_port}: {address}:{port} adresine bağlanın"
  notes_title: "Notlar"
  keys_warning: "Bu dosyalar özel anahtarlar içerir. Şifre gibi koruyun ve gerekmeyen kopyaları silin."
  direct_note: "Tünel üzerinden markete yalnızca `{file}` dosyasını çalıştıran makine ulaşır."
  router_note: "Kontrolör adresi, bu sunucuyu paylaşan marketler arasında benzersiz olmalıdır."

