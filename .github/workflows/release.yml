name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: ColdPerimeter-macos.zip
          - os: windows-latest
            artifact: ColdPerimeter-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[gui,package,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --noconfirm packaging/coldperimeter.spec
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ColdPerimeter.app ${{ matrix.artifact }}
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ColdPerimeter -DestinationPath ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum ColdPerimeter-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ColdPerimeter-*.zip
            SHA256SUMS.txt
