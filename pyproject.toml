[project]
name = "coldperimeter"
version = "0.1.0"
description = "Read-only exposure audit for supermarket refrigeration controllers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "cryptography>=42",
]

[project.optional-dependencies]
probe = ["fastapi>=0.110", "uvicorn>=0.29"]
gui = ["fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5.0"]
package = ["pyinstaller>=6.0"]

[project.scripts]
coldperimeter = "coldperimeter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coldperimeter", "probe_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
